
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crm-v3
  template:
    metadata:
      labels:
        app: crm-v3
    spec:
      containers:
        - name: crm
          image: 24mis0341/crm-devops:v3
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: crm-v3-service
spec:
  type: NodePort
  selector:
    app: crm-v3
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30003
