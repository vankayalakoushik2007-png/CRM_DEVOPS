
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crm-v1
  template:
    metadata:
      labels:
        app: crm-v1
    spec:
      containers:
        - name: crm
          image: 24mis0341/crm-devops:v1
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: crm-v1-service
spec:
  type: NodePort
  selector:
    app: crm-v1
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30001
